name: Live scraper smoke test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Run live scraper test
        run: python -m pytest -s -q tests/test_live.py
      - name: Print live JSON report
        if: always()
        run: |
          if [ -f live_report.json ]; then
            cat live_report.json
          else
            echo "live_report.json was not generated"
          fi
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-medicine-report
          path: live_report.json
          if-no-files-found: warn
